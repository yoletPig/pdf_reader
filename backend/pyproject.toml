[project]
name = "pdf-reader-backend"
version = "0.1.0"
description = "PDF Reader Agent - 论文阅读智能助手后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx[socks]>=0.27.0",
    "openai>=1.51.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.113.0",
    "docling-ibm-models>=3.13.0",
    "torch>=2.6.0",
    "onnxruntime>=1.19.0",
    "rapidocr>=3.9.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx-ws>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
