[project]
name = "pdf-reader-backend"
version = "0.1.0"
description = "PDF Reader Agent - 论文阅读智能助手后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx[socks]>=0.27.0",
    "openai>=1.51.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.10.0",
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.8.0",
    "cryptography>=42.0.0",
    "rank-bm25>=0.2.2",
    "docling>=2.113.0",
    "accelerate>=1.10.0",
    "docling-ibm-models>=3.13.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "rapidocr>=3.9.1",
    "onnxruntime-gpu>=1.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx-ws>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
